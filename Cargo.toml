[package]
name = "mcp-sentinel"
version = "0.1.0"
edition = "2021"
description = "MCP supply-chain integrity: config scanning, tool-definition hash pinning, mid-session drift detection, tamper-evident audit chain"
license = "MIT"
authors = ["WyattAu"]

[dependencies]
tamper-audit = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
